[project]
name = "companion-backend"
version = "0.1.0"
description = "Synthetic-data backend scaffold for the peer friendship scene"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1,<2",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
